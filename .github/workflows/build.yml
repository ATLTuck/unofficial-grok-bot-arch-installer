name: Build Arch package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install git and add a non-root builder
        run: |
          pacman -Syu --noconfirm git
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder

      - uses: actions/checkout@v4

      - name: Build grok-bot-bin
        run: |
          chown -R builder:builder .
          sudo -u builder makepkg -sf --noconfirm

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: grok-bot-bin
          path: "*.pkg.tar.zst"
          if-no-files-found: error

      - name: Attach package to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pacman -S --noconfirm github-cli
          tag="${GITHUB_REF_NAME}"
          notes="Unofficial Arch package of Grok Bot ${tag#v}. Not affiliated with xAI, SpaceXAI, or Cursor."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" *.pkg.tar.zst --clobber
          else
            gh release create "$tag" *.pkg.tar.zst --title "Grok Bot ${tag#v}" --notes "$notes"
          fi
